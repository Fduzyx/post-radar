name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Run synthetic tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Check types
        run: uv run mypy src
      - name: Build distributions
        run: uv build
      - name: Inspect tracked source and distributions
        run: uv run python scripts/check_release.py --source --artifacts dist
      - name: Run the installed wheel offline outside the checkout
        shell: bash
        run: |
          uv run python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tempfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, "Expected exactly one wheel"
          subprocess.run(
              ["uv", "pip", "install", "--python", sys.executable,
               "--reinstall", "--no-deps", str(wheels[0].resolve())],
              check=True,
          )
          with tempfile.TemporaryDirectory(prefix="post-radar-wheel-") as directory:
              subprocess.run(
                  [sys.executable, "-I", "-m", "post_radar", "demo"],
                  cwd=directory,
                  check=True,
              )
          PY
